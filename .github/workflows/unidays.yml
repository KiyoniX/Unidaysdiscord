name: UNiDAYS -> Discord

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unidays-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python unidays_bot.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Sauvegarder les offres vues
        run: |
          git config user.name "unidays-bot"
          git config user.email "unidays-bot@users.noreply.github.com"
          git add seen_offers.json
          git diff --cached --quiet || git commit -m "Mise à jour des offres vues"
          git push
